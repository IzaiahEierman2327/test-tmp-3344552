name: Bump v0.4.0 metadata

on:
  push:
    branches:
      - release/v0.4.0

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Synchronize package version
        run: |
          npm pkg set version=0.4.0
          npm install --package-lock-only --ignore-scripts
      - name: Commit version metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "Version metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Set version to 0.4.0"
          git push origin HEAD:release/v0.4.0
