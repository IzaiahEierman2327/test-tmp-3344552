name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install desktop dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check src/main.js
          node --check src/app-controller.js
          node --check src/jupyter.js
          node --check src/storage-paths.js
          node --check src/workspace.js
          node --check src/workbench-service.js
          node --check src/snippet-store.js
          node --check src/search.js
          node --check src/statistics.js
          node --check src/package-manager.js
          node --check src/ai-manager.js
          node --check src/article-store.js
          node --check src/preload.js
          node --check src/tools-preload.js
          node --check src/ui/renderer.js
          node --check src/ui/tools.js
          node --check scripts/prepare-runtime.js
          node --check scripts/smoke-jupyter.js
          node --check scripts/verify-packaged-runtime.js
          node --check scripts/verify-portable-package.js
      - name: Unit tests
        run: npm test

  jupyter-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Jupyter test dependencies
        run: python -m pip install -r runtime/requirements.txt
      - name: Locate test Python prefix
        run: echo "EULER_RUNTIME_ROOT=$(python -c 'import sys; print(sys.prefix)')" >> "$GITHUB_ENV"
      - name: Jupyter integration smoke test
        run: npm run test:jupyter
