name: Build and release desktop packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match package.json version, e.g. v0.4.0)
        required: true
        default: v0.4.0
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve and validate release metadata
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"
          TAG="${EXPECTED_TAG}"
          PUBLISH=false
          SKIP=false

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Manual releases must be dispatched from main; got ${GITHUB_REF}." >&2
              exit 1
            fi
            TAG="${REQUESTED_TAG}"
            PUBLISH=true
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            PUBLISH=true
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG="${EXPECTED_TAG}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Release tag ${TAG} already exists; skipping duplicate main-branch release."
              SKIP=true
            else
              PUBLISH=true
            fi
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            BRANCH_TAG="${GITHUB_REF_NAME#release/}"
            if [[ "${BRANCH_TAG}" != "${EXPECTED_TAG}" ]]; then
              echo "Release branch ${GITHUB_REF_NAME} does not match package version ${VERSION}; expected release/${EXPECTED_TAG}." >&2
              exit 1
            fi
            TAG="${EXPECTED_TAG}"
          else
            echo "Unsupported release trigger: ${GITHUB_REF}." >&2
            exit 1
          fi

          if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag ${TAG} does not match package.json version ${VERSION}; expected ${EXPECTED_TAG}." >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "publish=${PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "skip=${SKIP}" >> "${GITHUB_OUTPUT}"

  build:
    needs: metadata
    if: needs.metadata.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install desktop dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Prepare self-contained Python runtime
        run: npm run prepare:runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify Python isolation
        run: npm run verify:runtime
      - name: Verify Jupyter integration
        run: npm run test:jupyter
      - name: Build desktop packages
        run: npm run dist
      - name: Verify packaged runtime
        run: npm run verify:package
      - name: Verify release package layout
        run: npm run verify:portable
      - uses: actions/upload-artifact@v7
        with:
          name: project-euler-workbench-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "release-assets/euler-workbench-${VERSION}-win-x64-setup.exe"
            "release-assets/euler-workbench-${VERSION}-win-x64.zip"
            "release-assets/euler-workbench-${VERSION}-linux-x64.tar.gz"
          )
          for file in "${expected[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "Missing expected release asset: ${file}" >&2
              exit 1
            fi
          done

          shopt -s nullglob
          files=(release-assets/*)
          if (( ${#files[@]} != ${#expected[@]} )); then
            echo "Expected exactly ${#expected[@]} release assets, found ${#files[@]}." >&2
            printf 'Found: %s\n' "${files[@]}" >&2
            exit 1
          fi
          printf 'Release asset: %s\n' "${files[@]}"

      - name: Create or update GitHub Release
        if: needs.metadata.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --notes-file docs/V0.4_RELEASE_NOTES.md
          fi
